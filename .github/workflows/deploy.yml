name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - production
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false
        default: 'Manual trigger'
      target:
        description: 'Deploy target'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Determine deploy target
      # push to production branch → production
      # workflow_dispatch with target=production → production
      # workflow_dispatch with target=staging (default) → staging
      - name: Set deploy target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "env=production" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.target }}" = "production" ]; then
            echo "env=production" >> $GITHUB_OUTPUT
          else
            echo "env=staging" >> $GITHUB_OUTPUT
          fi

      - name: Build Astro site (staging)
        if: steps.target.outputs.env == 'staging'
        run: npm run build
        env:
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
          WORKER_URL: https://hercules-product-sync-fr.gilles-86d.workers.dev
          IS_STAGING: 'true'

      - name: Build Astro site (production)
        if: steps.target.outputs.env == 'production'
        run: npm run build
        env:
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY_PROD }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET_PROD }}
          WORKER_URL: https://hercules-product-sync-fr-prod.gilles-86d.workers.dev
          IS_STAGING: 'false'

      - name: Deploy Product Sync Worker (staging)
        if: steps.target.outputs.env == 'staging'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/product-sync/wrangler.toml

      - name: Deploy Edge Router (staging)
        if: steps.target.outputs.env == 'staging'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/edge-router/wrangler.toml

      - name: Deploy to Staging
        if: steps.target.outputs.env == 'staging'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=hercules-fr-staging --branch=main

      - name: Deploy Product Sync Worker (production)
        if: steps.target.outputs.env == 'production'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/product-sync/wrangler.prod.toml

      - name: Deploy Edge Router (production)
        if: steps.target.outputs.env == 'production'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/edge-router/wrangler.prod.toml

      - name: Deploy to Production
        if: steps.target.outputs.env == 'production'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=hercules-fr --branch=production

      - name: Output deployment URL
        run: |
          if [ "${{ steps.target.outputs.env }}" = "production" ]; then
            echo "Deployed to https://hercules-fr.pages.dev (production)"
          else
            echo "Deployed to https://hercules-fr-staging.pages.dev (staging)"
          fi

      - name: Trigger post-deploy health check
        if: success() && steps.target.outputs.env == 'production'
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.HEALTH_CHECK_TOKEN }}" \
            https://api.github.com/repos/royboy31/hercules-health-check/dispatches \
            -d '{"event_type":"deploy-fr"}' || true
