name = "hercules-form-handler-fr"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
SENDER_EMAIL = "info@hercules-merchandising.fr"
SENDER_NAME = "Hercules Merchandising"
COMPANY_EMAIL = "info@hercules-merchandising.fr"
R2_PUBLIC_URL = "https://pub-PLACEHOLDER.r2.dev"

[[routes]]
pattern = "staging.hercules-merchandising.fr/api/*"
zone_name = "hercules-merchandising.fr"

[[r2_buckets]]
binding = "FORM_UPLOADS"
bucket_name = "hercules-fr-form-uploads"

[env.production]
[env.production.vars]
SENDER_EMAIL = "info@hercules-merchandising.fr"
SENDER_NAME = "Hercules Merchandising"
COMPANY_EMAIL = "info@hercules-merchandising.fr"
R2_PUBLIC_URL = "https://pub-PLACEHOLDER.r2.dev"

[[env.production.r2_buckets]]
binding = "FORM_UPLOADS"
bucket_name = "hercules-fr-form-uploads-prod"
